<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Trailer View — FleetView</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/style.css">
</head>
<body data-page="trailers">
<header id="topbar"></header>
<div class="app-shell">
<nav id="sidebar-nav"></nav>

<main id="main">
  <div class="page-header">
    <div>
      <h1 class="page-title">All Trailers</h1>
      <div class="page-sub">Consolidated view · click a Trailer ID for full history</div>
    </div>
    <div style="display:flex;gap:8px">
      <span class="count-pill">Total: <b>500</b></span>
      <span class="count-pill">Filtered: <b id="filtered-count">500</b></span>
    </div>
  </div>

  <div class="panel">
    <div class="toolbar">
      <div class="search-box">
        <svg class="search-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>
        <input id="search-input" type="text" placeholder="Search Trailer ID" autocomplete="off">
      </div>
      <select class="select" id="filter-status">
        <option value="">All Statuses</option>
      </select>
      <select class="select" id="filter-sub">
        <option value="">All Sub Statuses</option>
      </select>
      <select class="select" id="filter-type">
        <option value="">All Types</option>
      </select>
      <span class="spacer"></span>
      <button class="btn-reset" id="btn-reset">Reset filters</button>
    </div>

    <div class="table-scroll">
      <table id="trailers-table">
        <colgroup id="thead-colgroup"></colgroup>
        <thead>
          <tr id="thead-row"></tr>
        </thead>
        <tbody id="table-body"></tbody>
      </table>
    </div>

    <div class="pagination">
      <div id="pagination-info"></div>
      <div class="pagination-btns" id="pagination-btns"></div>
    </div>
  </div>
</main>
</div>

<script src="assets/data.js"></script>
<script src="assets/app.js"></script>
<script src="assets/trailers.js"></script>
</body>
</html>
